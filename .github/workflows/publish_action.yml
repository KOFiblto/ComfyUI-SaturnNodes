name: Publish to ComfyUI Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Verify registry token
      env:
        REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      run: |
        if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
          echo "::error::REGISTRY_ACCESS_TOKEN is not configured. Create an API key at https://registry.comfy.org/nodes for the publisher 'kofiblto' and store it under Settings -> Secrets and variables -> Actions."
          exit 1
        fi
    - name: Publish Custom Node
      uses: Comfy-Org/publish-node-action@main
      with:
        personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    - name: Attach CHANGELOG section to the published version
      env:
        REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      run: |
        python - <<'PY'
        import json
        import os
        import re
        import sys
        import tomllib
        import urllib.error
        import urllib.request

        API = "https://api.comfy.org"
        PUBLISHER = "kofiblto"
        NODE = "saturnnodes"
        TOKEN = os.environ["REGISTRY_ACCESS_TOKEN"]

        with open("pyproject.toml", "rb") as handle:
            version = tomllib.load(handle)["project"]["version"]

        with open("CHANGELOG.md", encoding="utf-8") as handle:
            changelog = handle.read()

        # Grab the "## [<version>] ... " block up to the next "## [" heading.
        pattern = re.compile(
            rf"^##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
            re.MULTILINE | re.DOTALL,
        )
        match = pattern.search(changelog)
        if not match or not match.group(1).strip():
            print(f"::warning::No CHANGELOG.md section found for {version}; the registry version stays without a changelog.")
            sys.exit(0)

        body = match.group(1).strip()

        def call(method, path, payload=None):
            data = json.dumps(payload).encode("utf-8") if payload is not None else None
            request = urllib.request.Request(
                f"{API}{path}",
                data=data,
                method=method,
                headers={
                    "Authorization": f"Bearer {TOKEN}",
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
            )
            with urllib.request.urlopen(request, timeout=60) as response:
                return json.loads(response.read().decode("utf-8") or "{}")

        versions = call("GET", f"/nodes/{NODE}/versions")
        target = next((item for item in versions if item.get("version") == version), None)
        if not target:
            print(f"::warning::Version {version} is not listed on the registry yet; skipping the changelog update.")
            sys.exit(0)

        updated = call(
            "PUT",
            f"/publishers/{PUBLISHER}/nodes/{NODE}/versions/{target['id']}",
            {"changelog": body, "deprecated": False},
        )
        print(f"Registry changelog for {version} updated ({len(body)} chars).")
        PY
