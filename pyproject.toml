[project]
name = "saturnnodes"
description = "Workflow control and productivity suite for ComfyUI: mid-generation pause/continue, crash-safe persistent queue, batch queue visualizer, folder watchers, visual LoRA and image browsers, character preset cards, live latent previews, and stereogram tools."
version = "2.7.0"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["pillow", "numpy", "piexif"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
tray = ["pystray"]
stereogram = ["onnxruntime"]

[project.urls]
Repository = "https://github.com/KOFiblto/ComfyUI-SaturnNodes"
"Bug Tracker" = "https://github.com/KOFiblto/ComfyUI-SaturnNodes/issues"
Documentation = "https://github.com/KOFiblto/ComfyUI-SaturnNodes#readme"

[tool.comfy]
PublisherId = "kofiblto"
DisplayName = "ComfyUI-SaturnNodes"
Icon = "https://raw.githubusercontent.com/KOFiblto/ComfyUI-SaturnNodes/main/web/logo.png"
requires-comfyui = ">=0.3.0"
